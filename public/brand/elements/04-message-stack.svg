<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Message stack</title>
  <desc id="desc">Five source cards held in a precise evidence stack.</desc>
  
  <defs>
    <linearGradient id="porcelain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D9D3C8"/>
    </linearGradient>
    <linearGradient id="graphite" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B373C"/><stop offset="1" stop-color="#172126"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4B74EA"/><stop offset="1" stop-color="#2447AD"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#43837D"/><stop offset="1" stop-color="#205652"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="18" dy="24" stdDeviation="18" flood-color="#172126" flood-opacity="0.20"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="8" dy="12" stdDeviation="10" flood-color="#172126" flood-opacity="0.16"/>
    </filter>
  </defs>
  <g filter="url(#shadow)" transform="rotate(-5 512 520)">
      <rect x="282" y="324" width="500" height="354" rx="38" fill="#DDE5EE" stroke="#172126" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>
      <rect x="258" y="354" width="500" height="354" rx="38" fill="#D9D3C8" stroke="#172126" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>
      <rect x="234" y="384" width="500" height="354" rx="38" fill="#DDE5EE" stroke="#172126" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>
      <rect x="210" y="414" width="500" height="354" rx="38" fill="#D9D3C8" stroke="#172126" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>
      <rect x="186" y="444" width="500" height="354" rx="38" fill="url(#porcelain)" stroke="#172126" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>
      <rect x="650" y="462" width="124" height="54" rx="18" fill="#2F5DE5" stroke="#172126" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>
      <rect x="638" y="544" width="136" height="54" rx="18" fill="#2A6F6A" stroke="#172126" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>
      <rect x="210" y="432" width="42" height="348" rx="18" fill="#172126"/>
    </g>
</svg>
