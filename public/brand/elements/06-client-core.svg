<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Client core</title>
  <desc id="desc">A serviceable system core with an open owner-access panel.</desc>
  
  <defs>
    <linearGradient id="porcelain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D9D3C8"/>
    </linearGradient>
    <linearGradient id="graphite" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B373C"/><stop offset="1" stop-color="#172126"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4B74EA"/><stop offset="1" stop-color="#2447AD"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#43837D"/><stop offset="1" stop-color="#205652"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="18" dy="24" stdDeviation="18" flood-color="#172126" flood-opacity="0.20"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="8" dy="12" stdDeviation="10" flood-color="#172126" flood-opacity="0.16"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
      <rect x="250" y="244" width="524" height="540" rx="72" fill="url(#graphite)" stroke="#172126" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>
      <rect x="290" y="284" width="444" height="460" rx="48" fill="url(#porcelain)" stroke="#172126" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M290 340 H484 V706 H290 Z" fill="#DDE5EE" stroke="#172126" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M484 340 L360 286 V698 L484 706 Z" fill="url(#porcelain)" stroke="#172126" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="626" cy="514" r="92" fill="#F4F1EA" stroke="#172126" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M626 514 L680 462" fill="none" stroke="#2F5DE5" stroke-width="26" stroke-linecap="round"/>
      <circle cx="626" cy="514" r="18" fill="#172126"/>
    </g>
</svg>
