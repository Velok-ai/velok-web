<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Audit lens</title>
  <desc id="desc">A clear inspection ring aligned over one source card.</desc>
  
  <defs>
    <linearGradient id="porcelain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D9D3C8"/>
    </linearGradient>
    <linearGradient id="graphite" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B373C"/><stop offset="1" stop-color="#172126"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4B74EA"/><stop offset="1" stop-color="#2447AD"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#43837D"/><stop offset="1" stop-color="#205652"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="18" dy="24" stdDeviation="18" flood-color="#172126" flood-opacity="0.20"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="8" dy="12" stdDeviation="10" flood-color="#172126" flood-opacity="0.16"/>
    </filter>
  </defs>
  
    <g filter="url(#shadow)">
      <rect x="196" y="650" width="656" height="166" rx="56" fill="#172126" opacity="0.98"/>
      <rect x="184" y="626" width="656" height="166" rx="56" fill="url(#porcelain)" stroke="#172126" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>
      <rect x="238" y="756" width="548" height="18" rx="9" fill="#2F5DE5"/>
    </g>
      <g filter="url(#soft)">
        <rect x="332" y="468" width="360" height="222" rx="26" fill="#F4F1EA" stroke="#172126" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>
        <path d="M376 524 H624 M376 574 H586" fill="none" stroke="#172126" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" opacity="0.32"/>
        <circle cx="512" cy="384" r="204" fill="#DDE5EE" fill-opacity="0.42" stroke="#172126" stroke-width="68"/>
        <path d="M656 528 L752 624" fill="none" stroke="#2F5DE5" stroke-width="62" stroke-linecap="round"/>
      </g>
</svg>
