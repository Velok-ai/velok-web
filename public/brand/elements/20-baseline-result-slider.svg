<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Baseline result slider</title>
  <desc id="desc">A comparison rail showing movement from baseline to a verified result.</desc>
  
  <defs>
    <linearGradient id="porcelain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D9D3C8"/>
    </linearGradient>
    <linearGradient id="graphite" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B373C"/><stop offset="1" stop-color="#172126"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4B74EA"/><stop offset="1" stop-color="#2447AD"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#43837D"/><stop offset="1" stop-color="#205652"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="18" dy="24" stdDeviation="18" flood-color="#172126" flood-opacity="0.20"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="8" dy="12" stdDeviation="10" flood-color="#172126" flood-opacity="0.16"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
      <rect x="156" y="352" width="712" height="320" rx="74" fill="url(#porcelain)" stroke="#172126" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>
      <rect x="242" y="482" width="540" height="72" rx="36" fill="#172126"/>
      <rect x="486" y="482" width="296" height="72" rx="36" fill="url(#teal)"/>
      <circle cx="304" cy="518" r="76" fill="#F4F1EA" stroke="#172126" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="708" cy="518" r="76" fill="#2A6F6A" stroke="#172126" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M354 406 V630 M658 406 V630" fill="none" stroke="#172126" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" opacity="0.28"/>
    </g>
</svg>
