<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Data intake slot</title>
  <desc id="desc">One bounded source card entering a defined data slot.</desc>
  
  <defs>
    <linearGradient id="porcelain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D9D3C8"/>
    </linearGradient>
    <linearGradient id="graphite" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B373C"/><stop offset="1" stop-color="#172126"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4B74EA"/><stop offset="1" stop-color="#2447AD"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#43837D"/><stop offset="1" stop-color="#205652"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="18" dy="24" stdDeviation="18" flood-color="#172126" flood-opacity="0.20"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="8" dy="12" stdDeviation="10" flood-color="#172126" flood-opacity="0.16"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
      <rect x="156" y="500" width="712" height="270" rx="68" fill="url(#porcelain)" stroke="#172126" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>
      <rect x="242" y="574" width="540" height="82" rx="32" fill="url(#graphite)" stroke="#172126" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>
      <g transform="rotate(7 512 382)">
        <rect x="344" y="176" width="336" height="334" rx="34" fill="#F4F1EA" stroke="#172126" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>
        <path d="M402 278 H622 M402 350 H594" fill="none" stroke="#172126" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" opacity="0.30"/>
        <rect x="344" y="442" width="336" height="68" fill="#2F5DE5"/>
      </g>
    </g>
</svg>
