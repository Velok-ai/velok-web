<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Approval gate</title>
  <desc id="desc">An open V gate crossing an active rail with a human decision marker.</desc>
  
  <defs>
    <linearGradient id="porcelain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D9D3C8"/>
    </linearGradient>
    <linearGradient id="graphite" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B373C"/><stop offset="1" stop-color="#172126"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4B74EA"/><stop offset="1" stop-color="#2447AD"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#43837D"/><stop offset="1" stop-color="#205652"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="18" dy="24" stdDeviation="18" flood-color="#172126" flood-opacity="0.20"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="8" dy="12" stdDeviation="10" flood-color="#172126" flood-opacity="0.16"/>
    </filter>
  </defs>
  
    <g filter="url(#shadow)">
      <rect x="154" y="634" width="740" height="174" rx="56" fill="#172126" opacity="0.98"/>
      <rect x="142" y="610" width="740" height="174" rx="56" fill="url(#porcelain)" stroke="#172126" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>
      <rect x="196" y="748" width="632" height="18" rx="9" fill="#2F5DE5"/>
    </g>
      <g filter="url(#soft)">
        <rect x="202" y="654" width="620" height="58" rx="29" fill="url(#blue)" stroke="#172126" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>
        <path d="M338 286 L512 604 L686 286" fill="none" stroke="url(#porcelain)" stroke-width="92" stroke-linejoin="round" stroke-linecap="round"/>
        <path d="M338 286 L512 604 L686 286" fill="none" stroke="#172126" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>
        <circle cx="714" cy="530" r="42" fill="#C44A35" stroke="#172126" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>
      </g>
</svg>
