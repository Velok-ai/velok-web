:root {
  /* velok-web app/globals.css */
  --porcelain: #f5f6f8; --porcelain-deep: #eaedf2; --paper: #ffffff; --graphite: #101b2b;
  --midnight: #10294d; --signal-blue: #315ee8; --signal-blue-dark: #2147c8; --mineral-teal: #16836f;
  --ember: #df5a42; --mist: #e9eef9; --body-ink: #536172; --note-ink: #647181;
  --line: rgb(16 27 43 / 13%); --shadow: 0 22px 60px rgb(16 27 43 / 10%);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--porcelain); overflow: hidden; }
body { font-family: 'Manrope Variable', sans-serif; color: var(--graphite); -webkit-font-smoothing: antialiased; }
#stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; overflow: hidden;
  background: radial-gradient(120% 90% at 70% 40%, #fbfcfd 0%, var(--porcelain) 55%, var(--porcelain-deep) 100%); }
.abs { position: absolute; }
.serif { font-family: 'Source Serif 4 Variable', Georgia, serif; font-style: italic; font-weight: 500; color: var(--signal-blue); letter-spacing: -0.01em; }

/* caption */
#kicker { font-size: 22px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--signal-blue); }
.cap { font-weight: 650; letter-spacing: -0.035em; line-height: 1.06; color: var(--graphite); text-wrap: balance; }
.cap .w { display: inline-block; white-space: pre; will-change: transform, opacity, filter; }
.cap .serif { font-size: 1.06em; }
.sub { font-weight: 500; color: var(--body-ink); letter-spacing: -0.01em; line-height: 1.3; }

/* soft 3D objects (V2 direction: matte paper, navy fabric, diffuse light, soft shadows) */
#zone { perspective: 2400px; }
#rig { position: absolute; inset: 0; transform-style: preserve-3d; }
.obj { position: absolute; border-radius: 26px;
  background: linear-gradient(165deg, #ffffff 0%, #fbfbfc 55%, #eef1f5 100%);
  box-shadow: inset 0 1.5px 0 #fff, inset 0 -3px 0 rgb(16 27 43 / 5%), 0 9px 0 -1px #dde2ea, 0 10px 0 -1px rgb(16 27 43 / 8%), 0 30px 70px rgb(16 27 43 / 13%); }
.navy { background: radial-gradient(120% 90% at 25% 15%, #1d4479 0%, #143461 45%, var(--midnight) 100%);
  box-shadow: inset 0 2px 0 rgb(255 255 255 / 12%), inset 0 -4px 0 rgb(0 0 0 / 18%), 0 10px 0 -1px #0a1c38, 0 34px 70px rgb(16 41 77 / 28%); color: #fff; }
.navy::after { content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: .18;
  background-image: repeating-linear-gradient(45deg, rgb(255 255 255 / 9%) 0 1px, transparent 1px 4px), repeating-linear-gradient(-45deg, rgb(0 0 0 / 14%) 0 1px, transparent 1px 4px); }
.hdr { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
.meta { font-size: 21px; font-weight: 600; color: var(--note-ink); }
.pill { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 16px; border-radius: 99px; font-size: 19px; font-weight: 700; white-space: nowrap; }
.pill.blue { background: var(--signal-blue); color: #fff; }
.pill.mist { background: var(--mist); color: var(--signal-blue-dark); }
.pill.ghost { background: transparent; color: var(--note-ink); box-shadow: inset 0 0 0 2px var(--line); }
.dot { width: 14px; height: 14px; border-radius: 99px; display: inline-block; }
.sheetlines i { display: block; height: 7px; border-radius: 9px; background: #cfd5de; margin: 9px 0; }
.btn { position: absolute; height: 64px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 750; }

/* transcript */
.tline { position: absolute; left: 34px; right: 34px; height: 76px; }
.tline b { display: block; font-size: 17px; letter-spacing: .12em; text-transform: uppercase; font-weight: 800; margin-bottom: 4px; }
.tline span { font-size: 26px; font-weight: 600; letter-spacing: -0.015em; white-space: nowrap; }

/* post */
#post { font-size: 34px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.72; color: var(--graphite); white-space: pre-wrap; }
#post .hl { position: relative; border-radius: 8px; padding: 2px 0; transition: none; }
#post .chip { position: absolute; left: calc(100% + 16px); top: 9px; line-height: 1; font-size: 19px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase;
  color: #fff; background: var(--signal-blue); padding: 6px 11px; border-radius: 99px; white-space: nowrap; transform-origin: 0 50%; }
#caret { display: inline-block; width: 3px; height: 38px; background: var(--signal-blue); vertical-align: -6px; margin-left: 2px; }

#veil { position: absolute; inset: 0; background: var(--porcelain); pointer-events: none; }
</style>
</head>

<script>
(() => {
/* ------------------------------------------------------------------ timing + easing
   Shared film runtime curves (lws, out, inout, in, back). SEEK contract: every frame is
   a pure function of t. No CSS animations, no state carried between frames. */
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
function bez(x1, y1, x2, y2) { return x => { if (x <= 0) return 0; if (x >= 1) return 1; let t = x;
  for (let i = 0; i < 8; i++) { const cx = 3*x1*t*(1-t)**2 + 3*x2*t*t*(1-t) + t**3 - x; const d = 3*x1*(1-t)**2 + 6*(x2-x1)*t*(1-t) + 3*(1-x2)*t*t; if (Math.abs(d) < 1e-6) break; t -= cx/d; }
  return 3*y1*t*(1-t)**2 + 3*y2*t*t*(1-t) + t**3; }; }
const back = x => { x = clamp(x); const c1 = 1.4, c3 = c1 + 1; return 1 + c3*Math.pow(x-1,3) + c1*Math.pow(x-1,2); };
const EASE = { lws: bez(.2,0,0,1), out: bez(.16,1,.3,1), inout: bez(.65,0,.35,1), in: bez(.5,0,.9,.4), back, lin: x => clamp(x) };
const prog = (t, at, dur, e = 'out') => EASE[e](clamp((t - at) / dur));
const exitK = (t, out, d = .35) => out == null ? 0 : prog(t, out, d, 'in');
function rng(seed) { let s = seed >>> 0 || 1; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }

const DUR = 42, END_T = 40.2;
const q = new URLSearchParams(location.search);
const PORTRAIT = q.get('ratio') === 'portrait' || (q.get('ratio') !== 'landscape' && innerWidth / innerHeight < 1.1);
const [W, H] = PORTRAIT ? [1080, 1350] : [1920, 1080];
const stage = document.getElementById('stage'), rig = document.getElementById('rig'), zone = document.getElementById('zone');
stage.style.width = W + 'px'; stage.style.height = H + 'px';
const fit = () => { const s = Math.min(innerWidth / W, innerHeight / H);
  stage.style.transform = `translate(${(innerWidth - W * s) / 2}px,${(innerHeight - H * s) / 2}px) scale(${s})`; };
fit(); addEventListener('resize', fit);

// layout: caption column + 1000x760 action zone (landscape side by side, portrait stacked)
const LAY = PORTRAIT
  ? { mark: [40, 52, 40], kick: [40, 150], cap: [40, 192, 1000], capSize: 64, zone: [40, 450] }
  : { mark: [100, 84, 44], kick: [100, 330], cap: [100, 374, 700], capSize: 70, zone: [860, 160] };
const mark = document.getElementById('mark'), kick = document.getElementById('kicker'), caps = document.getElementById('caps');
Object.assign(mark.style, { left: LAY.mark[0] + 'px', top: LAY.mark[1] + 'px' });
const svg = mark.querySelector('svg'); svg.style.height = LAY.mark[2] + 'px'; svg.style.width = 'auto'; svg.style.display = 'block';
Object.assign(kick.style, { left: LAY.kick[0] + 'px', top: LAY.kick[1] + 'px' });
Object.assign(caps.style, { left: LAY.cap[0] + 'px', top: LAY.cap[1] + 'px', width: LAY.cap[2] + 'px' });
Object.assign(zone.style, { left: LAY.zone[0] + 'px', top: LAY.zone[1] + 'px', width: '1000px', height: '760px' });

const el = (parent, cls = '', css = {}, html = '') => { const e = document.createElement('div'); if (cls) e.className = cls; Object.assign(e.style, css); if (html) e.innerHTML = html; parent.appendChild(e); return e; };
const px = n => n + 'px';
const box = (parent, cls, x, y, w, h, html = '') => el(parent, 'abs ' + cls, { left: px(x), top: px(y), width: px(w), height: h == null ? '' : px(h) }, html);

/* ------------------------------------------------------------------ beats + copy */
const BEATS = [
  { at: 0.0,  end: 3.5,  kick: 'Agents velok', cap: 'Comment nos agents écrivent avec *votre voix.*' },
  { at: 3.6,  end: 9.3,  kick: '01 · L’appel', cap: 'Chaque appel est enregistré. *Rien ne se perd.*' },
  { at: 9.4,  end: 14.3, kick: '02 · La collecte', cap: 'Un agent récupère tout, *par e-mail.*' },
  { at: 14.4, end: 18.9, kick: '03 · P0', cap: 'Tout arrive chez P0, *notre chef de projet.*' },
  { at: 19.0, end: 24.3, kick: '04 · Le brief', cap: 'P0 écrit le brief. Au centre : *votre ton de voix.*' },
  { at: 24.4, end: 31.3, kick: '05 · La rédaction', cap: 'L’agent reprend *vos vrais mots.* C’est très humain.' },
  { at: 31.4, end: 35.9, kick: '06 · La validation', cap: 'Vous relisez. Rien ne part *sans votre accord.*' },
  { at: 36.0, end: 41.3, kick: '', cap: 'Plus il vous écoute, plus c’est *votre voix.*', sub: 'Chaque transcription lui apprend vos mots.' },
];
const capEls = BEATS.map(b => {
  const c = el(caps, 'abs cap', { left: 0, top: 0, width: '100%', fontSize: px(LAY.capSize) });
  const words = [];
  b.cap.split(/(\*[^*]+\*)/).filter(Boolean).forEach(part => {
    const it = part.startsWith('*'); const txt = it ? part.slice(1, -1) : part;
    txt.split(' ').filter(Boolean).forEach(w => { const s = document.createElement('span'); s.className = 'w' + (it ? ' serif' : ''); s.textContent = w + ' '; c.appendChild(s); words.push(s); });
  });
  let sub = null;
  if (b.sub) { sub = el(c, 'sub', { fontSize: px(PORTRAIT ? 32 : 32), marginTop: '28px', letterSpacing: '-0.01em' }); sub.textContent = b.sub; }
  return { c, words, sub, b };
});
function capFrame(t) {
  let k0 = 0, kt = '';
  capEls.forEach(({ c, words, sub, b }, i) => {
    const on = t >= b.at - .05 && t < b.end + .4;
    c.style.display = on ? '' : 'none'; if (!on) return;
    const ex = exitK(t, b.end);
    words.forEach((s, j) => { const k = prog(t, b.at + .2 + j * .06, .7, 'out');
      s.style.opacity = k * (1 - ex); s.style.filter = `blur(${(1 - k) * 10}px)`;
      s.style.transform = `translateY(${(1 - k) * .42 - ex * .3}em)`; });
    if (sub) { const k = prog(t, b.at + 1.4, .8, 'lws'); sub.style.opacity = k * (1 - ex); sub.style.transform = `translateY(${(1 - k) * 18}px)`; }
    if (b.kick) { const k = prog(t, b.at + .05, .5, 'lws'); k0 = k * (1 - ex); kt = b.kick; }
  });
  kick.textContent = kt; kick.style.opacity = k0; kick.style.transform = `translateY(${(1 - k0) * 10}px)`;
  // the kicker sits above the caption: in landscape lift it by the caption height so long captions never collide
  if (!PORTRAIT) {
    const cur = capEls.find(({ b }) => t >= b.at - .05 && t < b.end + .4);
    if (cur) { const h = cur.c.offsetHeight; const top = 540 - h / 2; caps.style.top = px(top); kick.style.top = px(top - 50); }
  }
}

/* ------------------------------------------------------------------ helpers for objects */
const show = (e, k, ex, { dx = 0, dy = 46, s0 = .96, rot = 0, extra = '' } = {}) => {
  e.style.opacity = clamp(k * 1.4) * (1 - ex);
  e.style.transform = `translate(${(1 - k) * dx}px,${(1 - k) * dy - ex * 26}px) scale(${lerp(s0, 1, k)}) rotate(${(1 - k) * rot}deg) ${extra}`;

};

const colCard = box(rig, 'obj', 250, 170, 500, 430, `

const ROWS = [['wave', 'Transcription', 'appel de mardi'], ['mail', 'E-mail', 'Re : proposition'], ['doc', 'Document', 'notes de cadrage']];

const FLY = [

/* ------------------------------------------------------------------ 3 · P0 */
const p0 = box(rig, 'obj navy', 580, 150, 400, 470, `

const brief = box(rig, 'obj', 290, 20, 670, 720, `

/* ------------------------------------------------------------------ 7 · end: every transcript sharpens the voice */
const endR = rng(29), END_N = 44;
const endTiles = Array.from({ length: END_N }, (_, i) => {
  const e = box(rig, '', 0, 0, 16, 200); Object.assign(e.style, { borderRadius: '10px', transformOrigin: '50% 50%' });
  const env = Math.sin(Math.PI * (i + .5) / END_N);
  const h = 30 + 170 * env * (.45 + .55 * Math.abs(Math.sin(i * 1.7) * Math.cos(i * .63)));
  return { e, tx: 500 - (END_N * 21) / 2 + i * 21, h, sx: endR() * 1000, sy: endR() * 760 - 380, r: (endR() - .5) * 80, dl: endR() * 1.1 }; });

const veil = document.getElementById('veil');
window.DUR = DUR; window.END_T = END_T;
window.SEEK = t => {
  t = ((t % DUR) + DUR) % DUR;
  capFrame(t);
  // the whole rig breathes a little in 3D: the V2 objects sit on a table under diffuse light
  const ry = -7 + 3 * Math.sin(t * .22), rx = 5 + 1.5 * Math.sin(t * .17 + 1);
  rig.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg)`;
  // wordmark: always on, hidden while the end frame carries the big one
  mark.style.opacity = 1 - prog(t, 37.6, .5, 'inout');

  // 0 · intro
  { const k = prog(t, .3, .9, 'back'), ex = exitK(t, 3.2);
    show(S0, k, ex, { dy: 60, s0: .7, rot: -6, extra: `rotate(${-3 + Math.sin(t * 1.3) * 1.5}deg)` });
    introBars.forEach((b, i) => { const kk = prog(t, .8 + i * .03, .5, 'out');
      const a = .25 + .75 * Math.abs(Math.sin(t * 5.1 + i * .9) * Math.sin(t * 2.3 + i * .37));
      b.style.opacity = kk * (1 - ex); b.style.transform = `scaleY(${Math.max(.08, kk * a)})`; }); }

  // 1 · the call
  if (t > 3 && t < 10) {
    const k = prog(t, 3.8, .8, 'lws'), ex = exitK(t, 9.0);
    show(callCard, k, ex, { dy: -50 });
    const live = t > 4.2 && t < 9.2;
    rec.style.opacity = live ? .45 + .55 * (Math.sin(t * 6) > 0 ? 1 : .3) : .3;
    const secs = Math.max(0, Math.floor((t - 4.2) * 4)) + 754;
    clock.textContent = `${String(Math.floor(secs / 60)).padStart(2, '0')}:${String(secs % 60).padStart(2, '0')}`;
    const voiceA = Math.abs(Math.sin(t * 1.9)) > .25 ? 1 : .35; // turns of speech
    waveBars.forEach((b, i) => { const kk = prog(t, 4.0 + i * .012, .4, 'out');
      const n = Math.abs(Math.sin(t * 7.3 + i * .71) * .6 + Math.sin(t * 3.1 + i * 1.93) * .4);
      const env = .35 + .65 * Math.sin(Math.PI * (i + .5) / WAVE_N);
      const a = live ? .08 + .92 * n * env * voiceA : .06;
      b.style.transform = `scaleY(${Math.max(.05, kk * a)})`; b.style.opacity = kk; });
    const k2 = prog(t, 4.9, .8, 'lws'); show(trCard, k2, ex, { dy: 60 });
    trLines.forEach((r, i) => { const kk = prog(t, LINE_AT[i], .55, 'out'); r.style.opacity = kk; r.style.filter = `blur(${(1 - kk) * 6}px)`; r.style.transform = `translateY(${(1 - kk) * 20}px)`; });
    trList.style.transform = `translateY(${-prog(t, 8.0, .5, 'lws') * 76}px)`;
  } else { hide(callCard); hide(trCard); }

  // 2 · collection
  const colIn = prog(t, 9.6, .8, 'lws');
  if (t > 9 && t < 19.2) {
    const ex = exitK(t, 18.5);
    // in beat 3 the collection card steps aside to the left and shrinks
    const mv = prog(t, 14.5, .9, 'inout');
    show(colCard, colIn, ex, { dy: 50, extra: `translate(${lerp(0, -250, mv)}px,${lerp(0, 10, mv)}px) scale(${lerp(1, .66, mv)})` });
    colRows.forEach((r, i) => { const kk = prog(t, FLY_AT[i] + .85, .4, 'out'); r.style.opacity = kk; r.style.transform = `translateX(${(1 - kk) * 16}px)`;
      const ok = r.querySelector('.rowok'), kc = prog(t, FLY_AT[i] + 1.1, .4, 'back'); ok.style.transform = `scale(${kc})`; });
    colCard.style.boxShadow = '';
  } else hide(colCard);
  FLY.forEach((f, i) => { const e = flyEls[i]; const a = FLY_AT[i];
    if (t < a - .05 || t > a + 1.1) { hide(e); return; }
    const k = prog(t, a, .95, 'inout');
    const tx = 250 + 34 - 85, ty = 170 + 144 + i * 90 - 39;   // lands on its row icon
    const x = lerp(f.from[0], tx, k), y = lerp(f.from[1], ty, k) - Math.sin(Math.PI * k) * 120;
    const s = lerp(1, .26, prog(t, a + .55, .45, 'in'));
    e.style.visibility = 'visible'; e.style.opacity = 1 - prog(t, a + .85, .15, 'lin');
    e.style.transform = `translate(${x}px,${y}px) rotate(${lerp(f.rot, 0, k)}deg) scale(${s})`; e.style.transformOrigin = '50% 50%'; });
  flurry.forEach(({ e, sx, sy, at }) => { if (t < at || t > at + 1) { hide(e); return; }
    const k = prog(t, at, .8, 'inout'); const x = lerp(sx, 278, k), y = lerp(sy, 194, k) - Math.sin(Math.PI * k) * 80;
    e.style.visibility = 'visible'; e.style.opacity = 1 - prog(t, at + .6, .2, 'lin'); e.style.transform = `translate(${x}px,${y}px) scale(${lerp(1, .4, k)})`; });

  // 3 · P0
  if (t > 14.5 && t < 19.6) {
    const k = prog(t, 14.9, .9, 'back'), ex = exitK(t, 19.0, .4);
    // at the cut to beat 4, P0 flies to the top left and becomes the small badge
    show(p0, k, ex * .0, { dy: 70, s0: .8 });
    const toBadge = prog(t, 18.6, .7, 'inout');
    p0.style.transform += ` translate(${lerp(0, -550, toBadge)}px,${lerp(0, -110, toBadge)}px) scale(${lerp(1, .5, toBadge)})`;
    p0.style.transformOrigin = '0 0';
    p0.style.opacity = clamp(k * 1.4) * (1 - prog(t, 19.15, .25, 'lin'));
    p0Rows.forEach((r, i) => { const kk = prog(t, PILL_AT[i] + .85, .4, 'back'); r.style.opacity = clamp(kk); r.style.transform = `scale(${lerp(.6, 1, kk)})`; r.style.transformOrigin = '0 50%'; });
    const dots = '.'.repeat(1 + Math.floor((t * 3) % 3));
    p0status.textContent = t > 17.4 ? 'Brief en préparation' + dots : '';
    p0status.style.opacity = prog(t, 17.4, .4);
    rail.style.visibility = 'visible';
    rail.style.transform = `scaleX(${prog(t, 15.1, .5, 'inout') * (1 - prog(t, 18.3, .3, 'in'))})`;
    rail.style.backgroundPosition = `${t * 40}px 0`;
  } else { hide(p0); rail.style.visibility = 'hidden'; }
  ROWS.forEach((_, i) => { const p = pills[i], a = PILL_AT[i];
    if (t < a || t > a + 1.1) { hide(p); return; }
    const k = prog(t, a, .9, 'inout'); const x = lerp(250, 620, k), y = lerp(370, 379 + i * 62, k) - Math.sin(Math.PI * k) * 60;
    p.style.visibility = 'visible'; p.style.opacity = clamp(k * 6) * (1 - prog(t, a + .8, .2, 'lin')); p.style.transform = `translate(${x}px,${y}px) scale(${lerp(1, .85, k)})`; });

  // 4 · brief
  if (t > 18.9 && t < 25) {
    const ex = exitK(t, 24.2);
    show(p0mini, prog(t, 19.2, .3, 'lin'), ex, { dy: 0, s0: 1 });
    show(brief, prog(t, 19.1, .9, 'lws'), ex, { dy: 70, rot: 3, extra: 'rotate(-1.2deg)' });
    briefRows.forEach((r, i) => { const kk = prog(t, 19.8 + i * .45, .55, 'out'); r.style.opacity = kk; r.style.transform = `translateY(${(1 - kk) * 14}px)`; r.style.filter = `blur(${(1 - kk) * 6}px)`; });
    const kh = prog(t, 20.7, .5, 'out'); tonHead.style.opacity = kh; tonHead.style.transform = `translateY(${(1 - kh) * 14}px)`;
    tonItems.forEach((r, i) => { const kk = prog(t, 21.0 + i * .3, .5, 'out'); r.style.opacity = kk; r.style.transform = `translateY(${(1 - kk) * 12}px)`; });
    const hl = prog(t, 21.9, .7, 'inout');
    tonBg.style.transform = `scaleX(${hl})`; tonBar.style.transform = `scaleY(${prog(t, 21.9, .5, 'lws')})`;
    tonHead.firstElementChild.style.color = hl > .5 ? 'var(--signal-blue)' : '';
    tonBlock.style.transform = `scale(${1 + .025 * Math.sin(Math.PI * prog(t, 22.3, .6, 'lin'))})`;
    const ka = prog(t, 23.0, .5, 'back'); toAgent.style.opacity = clamp(ka); toAgent.style.transform = `translateX(${(1 - ka) * -20 + prog(t, 23.8, .4, 'in') * 30}px)`;
  } else { hide(brief); hide(p0mini); }

  // 5 · content agent
  if (t > 24.3 && t < 32) {
    const ex = exitK(t, 31.1);
    show(comp, prog(t, 24.5, .8, 'lws'), ex, { dy: 70 });
    let n = Math.round(TOTAL_CH * clamp((t - TYPE_AT) / TYPE_DUR));
    segEls.forEach(({ sp, txt, chip, s }) => {
      const take = Math.max(0, Math.min(s.t.length, n)); n -= take;
      txt.textContent = s.t.slice(0, take);
      if (s.hl) { const done = take === s.t.length; const doneAt = done ? (TYPE_AT + TYPE_DUR * (SEGS.slice(0, SEGS.indexOf(s) + 1).reduce((a, q) => a + q.t.length, 0)) / TOTAL_CH) : 1e9;
        const kh = prog(t, doneAt + .1, .45, 'inout');
        sp.style.background = `linear-gradient(90deg, rgb(233 238 249) ${kh * 100}%, transparent ${kh * 100}%)`;
        sp.style.boxShadow = kh > 0 ? `inset 0 -4px 0 rgb(49 94 232 / ${kh})` : 'none';
        sp.style.color = kh > .5 ? 'var(--midnight)' : '';
        const kc = prog(t, doneAt + .35, .45, 'back'); chip.style.opacity = clamp(kc * 2); chip.style.transform = `scale(${kc})`; chip.style.display = take ? '' : 'none'; }
    });
    caret.style.opacity = (t < TYPE_AT + TYPE_DUR + .1 ? 1 : (Math.floor(t * 2.5) % 2)) * prog(t, 24.9, .2, 'lin');
    const ks = prog(t, 29.7, .6, 'out'); srcLine.style.opacity = ks; srcLine.style.transform = `translateY(${(1 - ks) * 14}px)`;
  } else hide(comp);

  // 6 · review
  if (t > 31.3 && t < 36.5) {
    const ex = exitK(t, 35.7);
    show(photo, prog(t, 31.5, .9, 'lws'), ex, { dy: 50, dx: -30, extra: 'rotate(-1.5deg)' });
    show(review, prog(t, 31.9, .9, 'lws'), ex, { dy: 70, dx: 30, extra: 'rotate(1deg)' });
    const done = t >= CLICK_AT + .1;
    bOkTxt.textContent = done ? 'Approuvé' : 'Approuver';
    bOkIco.style.display = done ? '' : 'none';
    const press = Math.sin(Math.PI * prog(t, CLICK_AT - .05, .25, 'lin'));
    bOk.style.background = done ? 'var(--mineral-teal)' : 'var(--signal-blue)';
    bOk.style.boxShadow = done ? '0 6px 0 -1px #0f6253, 0 14px 30px rgb(22 131 111 / 30%)' : '0 6px 0 -1px #1f43b8, 0 14px 30px rgb(49 94 232 / 30%)';
    bOk.style.transform = `translateY(${press * 5}px) scale(${1 + .05 * Math.sin(Math.PI * prog(t, CLICK_AT + .1, .4, 'lin'))})`;
    const kc = prog(t, 32.9, 1.0, 'inout');
    const cx = lerp(900, OK_TO[0], kc), cy = lerp(820, OK_TO[1], kc);
    cursor.style.visibility = t > 32.7 && t < 35.8 ? 'visible' : 'hidden';
    cursor.style.opacity = clamp((t - 32.7) * 4) * (1 - ex);
    cursor.style.transform = `translate(${cx}px,${cy}px) scale(${1 - press * .12})`;
    const r = clamp((t - CLICK_AT) / .5);
    ring.style.visibility = r > 0 && r < 1 ? 'visible' : 'hidden';
    ring.style.opacity = 1 - r; ring.style.transform = `translate(${OK_TO[0] - 45}px,${OK_TO[1] - 45}px) scale(${.4 + r})`;
  } else { hide(photo); hide(review); hide(cursor); hide(ring); }

  // 7 · end
  if (t > 35.9) {
    endTiles.forEach((d, i) => {
      const k = prog(t, 36.2 + d.dl, 1.1, 'inout');
      const x = lerp(d.sx, d.tx, k), y = lerp(d.sy + 380, 330, k);
      const hh = lerp(64, d.h, prog(t, 36.6 + d.dl, 1.0, 'lws'));
      d.e.style.visibility = 'visible';
      d.e.style.opacity = clamp((t - 36.2 - d.dl) * 3);
      d.e.style.height = px(hh);
      d.e.style.transform = `translate(${x}px,${y - hh / 2}px) rotate(${lerp(d.r, 0, k)}deg)`;
      // paper sheets turn into the voice, left to right
      const tint = prog(t, 37.6 + i * .025, .5, 'lin');
      d.e.style.background = tint > .5 ? 'var(--signal-blue)' : '#ffffff';
      d.e.style.boxShadow = tint > .5 ? '0 10px 24px rgb(49 94 232 / 25%)' : '0 0 0 1.5px #d9dee6, 0 10px 24px rgb(16 27 43 / 10%)';
    });
    const kw = prog(t, 38.2, .8, 'lws');
    endWord.style.visibility = 'visible'; endWord.style.opacity = kw; endWord.style.transform = `translateY(${(1 - kw) * 24}px)`; endWord.style.filter = `blur(${(1 - kw) * 8}px)`;
  } else { endTiles.forEach(d => hide(d.e)); hide(endWord); }

  // loop seam: fade the end frame back to the empty porcelain the intro starts from
  veil.style.opacity = prog(t, 41.3, .6, 'inout') + (1 - prog(t, 0, .3, 'lin'));
};

/* ------------------------------------------------------------------ playback */
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const fixed = q.get('t');
document.fonts.ready.then(() => {
  window.__ready = true;
  if (fixed != null) { window.SEEK(+fixed); return; }
  if (reduce) { window.SEEK(END_T); return; }
  const t0 = performance.now();
  const loop = now => { window.SEEK((now - t0) / 1000); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
});
window.SEEK(fixed != null ? +fixed : reduce ? END_T : 0);
})();
</script>
</body>
</html>
